name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check local links
        env:
          LINKCHECK_ALLOW: "periodic-table.html: css/table.css"
        run: node .github/scripts/check-links.mjs .

      - name: Prepare site files
        run: rsync -a --exclude=.git --exclude=.github --exclude=_site --exclude=CNAME --exclude=.nojekyll --exclude=README.md --exclude=.gitignore ./ _site/

      - name: Deploy, verify, roll back on failure
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash .github/scripts/deploy.sh _site mendeleev-lab.ru
